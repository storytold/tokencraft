name: Gateway, connector, and SDKs
on: [push, pull_request]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the native package manifest and guides
        run: python3 -B -m unittest discover -s scripts -p test_native_package.py
      - name: Verify the authenticated smoke check readiness guard
        run: python3 -B -m unittest discover -s scripts -p test_smoke_authenticated_gateway.py
      - name: Install PostgreSQL 17 and jq
        run: bash .github/scripts/install-postgresql17-ubuntu.sh
      - name: Verify the public hosted release readiness gate
        run: python3 -B -m unittest discover -s scripts -p test_smoke_hosted_console.py
      - name: Install Rust and verify PostgreSQL tools
        run: |
          rustup show
          postgres --version | grep -E '^postgres \(PostgreSQL\) 17\.'
          command -v initdb pg_ctl
      - name: Verify capacity policy and PostgreSQL quota
        run: |
          python3 -B -m unittest discover -s deploy/autoscaling -p test_policy.py
          python3 -B deploy/autoscaling/verify_postgres.py --pg-bin-dir "$(dirname "$(command -v initdb)")"
      - name: Verify the separate operations collector
        run: |
          python3 -B -m unittest discover -s deploy/monitoring
          node --check deploy/monitoring/web/console.js
      - name: Test the launcher, provider mappings, shared enums, and Rust SDK
        run: cargo test --locked -p tokencraft -p provider_mapping -p enums -p tokencraft_sdk
      - name: Check gateway contracts and run the bundled connector
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/tokencraft"
          cargo run --locked -p tokencraft -- dev --state-dir "$state_dir" >"$RUNNER_TEMP/gateway.log" 2>&1 &
          launcher=$!
          trap 'kill -TERM "$launcher" 2>/dev/null || true; wait "$launcher" || true' EXIT
          for attempt in {1..480}; do
            if curl -fsS --max-time 2 http://localhost:4000/ready >/dev/null 2>&1; then
              curl -fsS --max-time 5 http://localhost:4000/v1/catalog/offers | jq -e '
                (.offers | length) == 1 and
                (.offers[0] | .id == "example_image" and .provider == "self_hosted" and .adapter == "connector_queue")
              ' >/dev/null
              contract_dir="$RUNNER_TEMP/tokencraft-contracts"
              bash scripts/export_contracts.sh "$contract_dir"
              diff -u contracts/openapi.json "$contract_dir/openapi.json"
              diff -u crates/core/provider-mapping/schemas/v1.json "$contract_dir/connector-primitives.json"
              bash examples/connector/smoke.sh
              python3 -B examples/connector/load.py --requests 16 --concurrency 8
              db_password="$(jq -er .database "$state_dir/dev-keys.json")"
              export PGHOST=127.0.0.1 PGPORT=55439 PGUSER=tokencraft PGPASSWORD="$db_password"
              createdb --maintenance-db=postgres -w tokencraft_export_test
              PGDATABASE=tokencraft_export_test TOKENCRAFT_SMOKE_EXPIRY_DATABASE=tokencraft_dev \
                python3 -B examples/postgres/smoke.py
              DATABASE_URL="postgresql://tokencraft:${db_password}@127.0.0.1:55439/tokencraft_dev" \
                SQLX_OFFLINE=false cargo test --locked -p api_gateway --lib
              DATABASE_URL="postgresql://tokencraft:${db_password}@127.0.0.1:55439/tokencraft_dev" \
                SQLX_OFFLINE=false cargo check --locked -p sweeper
              exit 0
            fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/gateway.log"
          exit 1
      - name: Check and rehearse signed catalog publication and import
        run: python3 -B scripts/smoke_reference_catalog.py target/debug/api-gateway
      - name: Verify the published workflow contract end to end
        run: |
          cargo build --locked -p admin_cli --bin admin-cli
          python3 -B scripts/smoke_workflow_contract.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify connector receipt recovery after a worker restart
        run: python3 -B scripts/smoke_connector_recovery.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify connector artifact validation and retrieval recovery
        run: python3 -B scripts/smoke_connector_artifact_validation.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify cell isolation and streaming failover
        shell: bash
        run: |
          set -euo pipefail
          proxy_dir="$RUNNER_TEMP/tokencraft-haproxy"
          mkdir -p "$proxy_dir"
          proxy_version=3.2.28
          archive="$proxy_dir/haproxy-$proxy_version.tar.gz"
          curl --fail --silent --show-error --retry 3 --max-time 60 \
            "https://www.haproxy.org/download/3.2/src/haproxy-$proxy_version.tar.gz" --output "$archive"
          printf '%s  %s\n' 56d08f65cfa756e95e8b64b76e28bdd5163c52d8a633dfa6a553f641e575698e "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$proxy_dir"
          make -s -j 2 -C "$proxy_dir/haproxy-$proxy_version" TARGET=linux-glibc
          export PATH="$proxy_dir/haproxy-$proxy_version:$PATH"
          python3 -B scripts/smoke_cell_faults.py target/debug/api-gateway target/debug/admin-cli
          python3 -B scripts/smoke_stream_failover.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify queued provider credential rotation and revocation
        run: python3 -B scripts/smoke_provider_credentials.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify rate expiry during budget contention
        run: python3 -B scripts/smoke_rate_admission.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify automatic event retirement and cold retrieval
        run: python3 -B scripts/smoke_event_archives.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify artifact publication and download backpressure
        run: python3 -B scripts/smoke_artifact_downloads.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify retained content restore and removal
        run: python3 -B scripts/smoke_content_restore.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify scoped request latency baselines
        run: python3 -B scripts/smoke_trace_baseline.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify reliability and settled-cost ranking under mixed workload
        run: python3 -B scripts/smoke_route_performance.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify model advice across previews and admission
        run: python3 -B scripts/smoke_advised_routing.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify client binding for signed quotes
        run: python3 -B scripts/smoke_quote_scope.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify webhook backlog isolation and recovery
        run: python3 -B scripts/smoke_webhook_backlog.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify scoped webhook signing key recovery
        run: python3 -B scripts/smoke_webhook_rotation.py target/debug/api-gateway target/debug/admin-cli
      - name: Verify profiled media runners and workflow reuse
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -B -m unittest discover -s plugins/tools/media -p test_media.py
          python3 -B scripts/smoke_media_finishing.py target/debug/api-gateway target/debug/admin-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokencraft-contracts
          path: ${{ runner.temp }}/tokencraft-contracts/*.json
          if-no-files-found: ignore

  typescript-sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Check console security headers
        run: node ../scripts/console_security_headers.mjs
      - name: Verify the console retention deadline
        run: node --experimental-strip-types --test ../scripts/console_retention_timer.test.mjs
      - name: Verify console submission snapshots and receipts
        run: node --experimental-strip-types --test ../scripts/console_model_submission.test.mjs
      - name: Verify console aspect ratio defaults and input
        run: node --experimental-strip-types --test ../scripts/console_aspect_ratio.test.mjs
      - name: Verify scoped console artifact downloads
        run: node --experimental-strip-types --test ../scripts/console_artifact_transfer.test.mjs
      - name: Verify public catalog transfer and offer limits
        run: node --experimental-strip-types --test ../scripts/console_reference_catalog.test.mjs
      - name: Verify console webhook rotation recovery state
        run: node --experimental-strip-types --test ../scripts/console_webhook_rotation.test.mjs
      - name: Reject a hosted console build without a revision
        env:
          TOKENCRAFT_REQUIRE_SOURCE_REVISION: "1"
        run: |
          log="$RUNNER_TEMP/console-missing-revision.log"
          if env -u TOKENCRAFT_SOURCE_REVISION -u VERCEL_GIT_COMMIT_SHA \
            ./node_modules/.bin/vite build >"$log" 2>&1; then
            echo 'Hosted console build succeeded without a source revision' >&2
            exit 1
          fi
          grep -F 'A hosted console build needs a source revision.' "$log"
      - name: Reject a native console with a fixed API origin
        env:
          VITE_TOKENCRAFT_PACKAGED: "true"
          VITE_API_BASE_URL: http://localhost:4000
        run: |
          log="$RUNNER_TEMP/console-fixed-api.log"
          if ./node_modules/.bin/vite build >"$log" 2>&1; then
            echo 'Native console build succeeded with a fixed API origin' >&2
            exit 1
          fi
          grep -F 'A packaged console uses the launcher API port.' "$log"
      - run: npm run build
        env:
          VITE_API_BASE_URL: /
          VITE_TOKENCRAFT_DEMO: "true"
          TOKENCRAFT_REQUIRE_SOURCE_REVISION: "1"
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Check the published catalog and API contract bytes
        run: |
          cmp ../catalog/artcraft-v1.json dist/catalog/artcraft-v1.json
          cmp ../contracts/openapi.json dist/docs/openapi.json
          jq -e --arg sha "$GITHUB_SHA" '.source_revision == $sha' dist/release.json >/dev/null
