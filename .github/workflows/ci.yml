name: Gateway, connector, and SDKs
on: [push, pull_request]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev jq
      - name: Install Rust and verify PostgreSQL tools
        run: |
          rustup show
          pg_bindir="$(pg_config --bindir)"
          test -x "$pg_bindir/initdb"
          test -x "$pg_bindir/pg_ctl"
      - name: Verify capacity policy and PostgreSQL quota
        run: |
          python3 -B -m unittest discover -s deploy/autoscaling -p test_policy.py
          python3 -B deploy/autoscaling/verify_postgres.py --pg-bin-dir "$(pg_config --bindir)"
      - name: Test the launcher, provider mappings, shared enums, and Rust SDK
        run: cargo test --locked -p tokencraft -p provider_mapping -p enums -p tokencraft_sdk
      - name: Check gateway contracts and run the bundled connector
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/tokencraft"
          cargo run --locked -p tokencraft -- dev --state-dir "$state_dir" >"$RUNNER_TEMP/gateway.log" 2>&1 &
          launcher=$!
          trap 'kill -TERM "$launcher" 2>/dev/null || true; wait "$launcher" || true' EXIT
          for attempt in {1..480}; do
            if curl -fsS --max-time 2 http://localhost:4000/ready >/dev/null 2>&1; then
              curl -fsS --max-time 5 http://localhost:4000/v1/catalog/offers | jq -e '
                (.offers | length) == 1 and
                (.offers[0] | .id == "example_image" and .provider == "self_hosted" and .adapter == "connector_queue")
              ' >/dev/null
              contract_dir="$RUNNER_TEMP/tokencraft-contracts"
              bash scripts/export_contracts.sh "$contract_dir"
              diff -u contracts/openapi.json "$contract_dir/openapi.json"
              diff -u crates/core/provider-mapping/schemas/v1.json "$contract_dir/connector-primitives.json"
              bash examples/connector/smoke.sh
              python3 -B examples/connector/load.py --requests 16 --concurrency 8
              db_password="$(jq -er .database "$state_dir/dev-keys.json")"
              export PGHOST=127.0.0.1 PGPORT=55439 PGUSER=tokencraft PGPASSWORD="$db_password"
              createdb --maintenance-db=postgres -w tokencraft_export_test
              PGDATABASE=tokencraft_export_test TOKENCRAFT_SMOKE_EXPIRY_DATABASE=tokencraft_dev \
                python3 -B examples/postgres/smoke.py
              DATABASE_URL="postgresql://tokencraft:${db_password}@127.0.0.1:55439/tokencraft_dev" \
                SQLX_OFFLINE=false cargo test --locked -p api_gateway --lib
              DATABASE_URL="postgresql://tokencraft:${db_password}@127.0.0.1:55439/tokencraft_dev" \
                SQLX_OFFLINE=false cargo check --locked -p sweeper
              exit 0
            fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/gateway.log"
          exit 1
      - name: Check and rehearse signed catalog publication and import
        run: python3 -B scripts/smoke_reference_catalog.py target/debug/api-gateway
      - name: Verify the published workflow contract end to end
        run: |
          cargo build --locked -p admin_cli --bin admin-cli
          python3 -B scripts/smoke_workflow_contract.py target/debug/api-gateway target/debug/admin-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokencraft-contracts
          path: ${{ runner.temp }}/tokencraft-contracts/*.json
          if-no-files-found: ignore

  typescript-sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Check console security headers
        run: node ../scripts/console_security_headers.mjs
      - run: npm run build
        env:
          VITE_API_BASE_URL: /
          VITE_TOKENCRAFT_DEMO: "true"
      - name: Check the published catalog and API contract bytes
        run: |
          cmp ../catalog/artcraft-v1.json dist/catalog/artcraft-v1.json
          cmp ../contracts/openapi.json dist/docs/openapi.json
