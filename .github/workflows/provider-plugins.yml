name: Provider plugins
on:
  push:
    paths:
      - 'plugins/providers/inference/**'
      - 'scripts/provider_response_cleanup.test.mjs'
      - '.github/workflows/provider-plugins.yml'
  pull_request:
    paths:
      - 'plugins/providers/inference/**'
      - 'scripts/provider_response_cleanup.test.mjs'
      - '.github/workflows/provider-plugins.yml'

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [fal, kinovi, openrouter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test provider plugin
        working-directory: plugins/providers/inference/${{ matrix.plugin }}
        run: npm test
      - name: Verify unused upstream responses close promptly
        if: matrix.plugin != 'openrouter'
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: node --test --test-name-pattern "^$PLUGIN " scripts/provider_response_cleanup.test.mjs
