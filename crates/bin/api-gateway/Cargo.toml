[package]
name = "api_gateway"
version = "0.1.0"
default-run = "api-gateway"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "api-gateway"
path = "src/main.rs"

[lib]
name = "api_gateway"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tokio-stream = "0.1"
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
httpdate = "1"
sqlx.workspace = true
utoipa.workspace = true
reqwest.workspace = true
# auth
argon2.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
sha2.workspace = true
hmac = "0.12"
ring = "0.17"
flate2 = "1"
hex.workspace = true
base64.workspace = true
# image decode/crop/resize (avatars)
image.workspace = true
provider_mapping.workspace = true
# internal
client_core.workspace = true
money.workspace = true
bucket_client.workspace = true
bucket_paths.workspace = true
config.workspace = true
enums.workspace = true
db.workspace = true
db_queries.workspace = true
email_client.workspace = true
ids.workspace = true

[dev-dependencies]
tower.workspace = true
id_core.workspace = true
