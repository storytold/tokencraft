# Merge into an existing Prometheus configuration. For a remote monitor, use
# its operator-only HTTPS reverse proxy and change the scheme and target.
rule_files:
  - tokencraft-monitor.rules.yml
scrape_configs:
  - job_name: tokencraft-operations
    scrape_interval: 30s
    scheme: http
    metrics_path: /metrics
    basic_auth:
      username: operator
      password_file: /run/secrets/tokencraft-monitor-password
    static_configs:
      - targets: ["127.0.0.1:9417"]
